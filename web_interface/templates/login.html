{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block header_title %}SECURITY CLEARANCE REQUIRED{% endblock %}

{% block content %}
<div class="hud-form-container">
    <div class="hud-card auth-card panel">
        <h2 class="glitch-text">OPERATOR AUTHENTICATION</h2>
        <p style="font-size: 0.8rem; color: #ff3e3e; margin-bottom: 20px;">READY_STATUS: LOCKED | AWAITING CREDENTIALS
        </p>

        <form method="POST">
            <div class="hud-input-group">
                <label>OPERATOR_ID</label>
                <input type="text" name="username" required autofocus class="hud-input">
            </div>
            <div class="hud-input-group">
                <label>ENCRYPTION_KEY</label>
                <input type="password" name="password" required class="hud-input">
            </div>

            <button type="submit" class="btn btn-primary btn-full">
                ESTABLISH UPLINK
            </button>
        </form>

        <div class="login-footer" style="margin-top: 25px; text-align: center; font-size: 0.85rem;">
            <a href="{{ url_for('register') }}" style="color: #00f3ff; text-decoration: none;">REQUEST ACCESS</a>
            <span style="color: rgba(255,255,255,0.3); margin: 0 10px;">|</span>
            <a href="{{ url_for('index') }}" style="color: rgba(255,255,255,0.7); text-decoration: none;">ABORT
                MISSION</a>
        </div>
    </div>
</div>
{% endblock %}
