{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block header_title %}NEW OPERATOR REGISTRATION{% endblock %}

{% block content %}
<div class="hud-form-container">
    <div class="hud-card auth-card panel">
        <h2 class="glitch-text">ENROLLMENT DATABASE</h2>
        <p style="font-size: 0.8rem; color: #00f3ff; margin-bottom: 20px;">INTAKE_STATUS: OPEN | ENTER BIOMETRICS</p>

        <form method="POST">
            <div class="hud-input-group">
                <label>CHOOSE_OPERATOR_ID</label>
                <input type="text" name="username" required class="hud-input">
            </div>
            <div class="hud-input-group">
                <label>NEW_ENCRYPTION_KEY</label>
                <input type="password" name="password" required class="hud-input">
            </div>
            <div class="hud-input-group">
                <label>CONFIRM_KEY</label>
                <input type="password" name="confirm_password" required class="hud-input">
            </div>

            <button type="submit" class="btn btn-primary btn-full">
                REQUEST INITIALIZATION
            </button>
        </form>

        <div class="register-footer" style="margin-top: 25px; text-align: center; font-size: 0.85rem;">
            <span style="color: rgba(255,255,255,0.5);">ALREADY_ENROLLED?</span>
            <a href="{{ url_for('login') }}" style="color: #00f3ff; text-decoration: none; margin-left: 10px;">LOGIN</a>
        </div>
    </div>
</div>
{% endblock %}
