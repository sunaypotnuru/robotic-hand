{% extends "base.html" %}

{% block title %}{{ 'Edit' if user else 'Add' }} User{% endblock %}

{% block header_title %}{{ 'EDIT' if user else 'NEW' }} OPERATOR{% endblock %}

{% block content %}
<div class="panel" style="max-width: 600px; margin: 0 auto;">
    <form method="POST">
        <div class="form-group" style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; color: #00f3ff;">Username</label>
            <input type="text" name="username" value="{{ user.username if user else '' }}" required class="hud-input"
                style="width: 100%; background: rgba(0,0,0,0.5); border: 1px solid #00f3ff; color: white; padding: 10px;">
        </div>
        <div class="form-group" style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; color: #00f3ff;">Password {% if user %}(leave blank to
                keep unchanged){% endif %}</label>
            <input type="password" name="password" {% if not user %}required{% endif %} class="hud-input"
                style="width: 100%; background: rgba(0,0,0,0.5); border: 1px solid #00f3ff; color: white; padding: 10px;">
        </div>
        <div class="form-group" style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; color: #00f3ff;">Role</label>
            <select name="role" class="hud-input"
                style="width: 100%; background: rgba(0,0,0,0.5); border: 1px solid #00f3ff; color: white; padding: 10px;">
                <option value="operator" {% if user and user.role=='operator' %}selected{% endif %}>Operator</option>
                <option value="admin" {% if user and user.role=='admin' %}selected{% endif %}>Admin</option>
            </select>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button type="submit" class="btn btn-primary">SAVE</button>
            <a href="{{ url_for('admin_users') }}" class="btn btn-secondary">CANCEL</a>
        </div>
    </form>
</div>
{% endblock %}
