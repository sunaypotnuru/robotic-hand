{% extends "base.html" %}

{% block title %}Change Password{% endblock %}

{% block header_title %}ENCRYPTION KEY ROTATION{% endblock %}

{% block content %}
<div class="hud-form-container">
    <div class="hud-card panel">
        <h2 class="glitch-text">UPDATE_SECURITY_LAYER</h2>
        <p style="font-size: 0.8rem; color: #ff3e3e; margin-bottom: 20px;">SECURITY_STATUS: ROTATION_PENDING</p>

        <form method="POST">
            <div class="hud-input-group">
                <label>CURRENT_ENCRYPTION_KEY</label>
                <input type="password" name="current_password" required class="hud-input">
            </div>
            <div class="hud-input-group">
                <label>NEW_ENCRYPTION_KEY</label>
                <input type="password" name="new_password" required class="hud-input">
            </div>
            <div class="hud-input-group">
                <label>CONFIRM_NEW_KEY</label>
                <input type="password" name="confirm_password" required class="hud-input">
            </div>

            <button type="submit" class="btn btn-primary btn-full">
                EXECUTE ROTATION
            </button>
        </form>

        <div style="margin-top: 25px; text-align: center;">
            <a href="{{ url_for('profile') }}"
                style="color: rgba(255,255,255,0.5); text-decoration: none; font-size: 0.9rem;">
                &lt; BACK_TO_PROFILE
            </a>
        </div>
    </div>
</div>
{% endblock %}
