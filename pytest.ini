[pytest]
# Pytest configuration for LUNA Robotic Arm

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Test markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    hardware: Tests requiring hardware connection

# Coverage options (when using pytest-cov)
# Run with: pytest --cov=. --cov-report=html
